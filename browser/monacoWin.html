<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Discord Translator QuickCSS Editor</title>
    <style>
        html,
        body,
        #container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        header {
            position: fixed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #1e1e1e;
            color: #1e1e1e;
            border-bottom: 1px solid #444;
            width: 100%;
            z-index: 10;
        }

        #container {
            margin-top: 45px;
            background-color: #1e1e1e;
            border: 1px solid #1e1e1e;
        }

        .toolbar button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <button id="selectAllButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; margin-right: 5px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Select
                All</button>
            <button id="saveButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; margin-right: 5px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Save</button>
            <button id="copyButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Copy</button>
            <button id="undoButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Undo</button>
            <button id="redoButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Redo</button>
        </div>
    </header>
    <div id="container"></div>

    <script>
        // Shared by both load paths, so the toolbar behaves identically whichever copy
        // of Monaco ended up being used.
        function wireToolbar(editor) {
            document.getElementById('selectAllButton').onclick = () => {
                editor.setSelection(editor.getModel().getFullModelRange());
                editor.focus();
            };

            document.getElementById('saveButton').onclick = () => {
                const css = editor.getValue();
                const blob = new Blob([css], { type: 'text/css' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'style.css';
                document.body.append(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            };

            document.getElementById('copyButton').onclick = () => {
                editor.focus();
                const selection = editor.getSelection();
                editor.setSelection(selection);
                document.execCommand('copy');
            };

            document.getElementById('undoButton').onclick = () => {
                editor.trigger('keyboard', 'undo');
            };

            document.getElementById('redoButton').onclick = () => {
                editor.trigger('keyboard', 'redo');
            };
        }

        /*
         * Monaco is loaded from inside the extension package. There is deliberately no
         * remote fallback.
         *
         * A CDN fallback used to live here for the plain-web build. It was removed
         * because a <script src> pointing outside the package is what Chrome's
         * Manifest V3 policy names as remotely hosted code, and because this extension
         * removes Discord's Content-Security-Policy - so a compromised CDN would have
         * executed in the logged-in discord.com origin with nothing left to stop it.
         * A niche build losing an optional editor is the cheaper side of that trade.
         *
         * openEditor in browser/VencordNativeStub.ts sets __monacoLocal before writing
         * this document, then injects the stylesheet and script it fetched from the
         * extension. It has to be the opener that fetches: this window is an
         * about:blank popup carrying the discord.com origin, and loading an extension
         * URL from inside it silently does nothing.
         */
        (function () {
            if (!window.__monacoLocal) {
                showUnavailable("The QuickCSS editor needs the browser extension build.");
                return;
            }
            waitForInjectedEditor();
        })();

        function showUnavailable(reason) {
            const box = document.getElementById("container");
            box.style.color = "#dbdee1";
            box.style.font = "14px/1.6 system-ui, sans-serif";
            box.style.padding = "24px";
            box.textContent = reason + " You can still edit custom CSS by installing the extension, or edit it as a file in the desktop build.";
        }

        function waitForInjectedEditor() {
            const deadline = Date.now() + 30000;

            (function poll() {
                if (window.__monacoLocalFailed) {
                    showUnavailable("The editor could not be loaded from the extension.");
                    return;
                }

                if (self.quickCssEditorReady) {
                    self.quickCssEditorReady.then(wireToolbar);
                    return;
                }

                if (Date.now() > deadline) {
                    showUnavailable("The editor did not finish loading.");
                    return;
                }

                setTimeout(poll, 50);
            })();
        }
    </script>
</body>

</html>
