name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npx --yes pnpm@10 install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests for the translator core. Uses vitest.config.ts, which excludes
      # test/live/** — those hit the real translate endpoint over the network and
      # are opt-in only via `pnpm test:live`. CI must never reach them.
      - name: Unit tests
        run: npx --yes pnpm@10 test:unit

      - name: Build
        run: npx --yes pnpm@10 build

      # Enumerates every host in the packed archives against scripts/allowed-hosts.txt.
      # Must run after the build: it reads dist/*.asar, never the sources.
      - name: Check third-party hosts
        run: node scripts/checkHosts.mjs
