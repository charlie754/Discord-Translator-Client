<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Discord Translator QuickCSS Editor</title>
    <!-- Monaco is copied into dist/<variant>/monaco/vs by scripts/build/build.mjs and
         resolved relative to this page, so nothing here touches the network. No SRI:
         a hash over a file inside our own asar guards nothing the asar does not
         already guard, and crossorigin on a same-origin file request can itself fail. -->
    <link rel="stylesheet" href="./monaco/vs/editor/editor.main.css" />
    <style>
        html,
        body,
        #container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <script src="./monaco/vs/loader.js"></script>

    <script>
        require.config({
            // Whatever version node_modules holds; deliberately not pinned here, since
            // the old hardcoded 0.50.0 had already drifted from the installed package.
            paths: {
                vs: "./monaco/vs",
            },
        });

        require(["vs/editor/editor.main"], () => {
            getCurrentCss().then((css) => {
                var editor = monaco.editor.create(
                    document.getElementById("container"),
                    {
                        value: css,
                        language: "css",
                        theme: getTheme(),
                    }
                );
                editor.onDidChangeModelContent(() =>
                    setCss(editor.getValue())
                );
                window.addEventListener("resize", () => {
                    // make monaco re-layout
                    editor.layout();
                });
            });
        });
    </script>
</body>

</html>
